name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write # OIDC (trusted publishing / provenance)
  pull-requests: write
concurrency: release-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # no registry-url: setup-node would write a placeholder _authToken to
          # .npmrc, which makes npm send an invalid token instead of using OIDC
      # trusted publishing + provenance need npm >= 11.5
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # Opens/updates the "Version Packages" PR while changesets are pending.
      - uses: changesets/action@v1
        id: changesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publishing is done with the npm CLI (not through changesets, which would
      # call pnpm publish) so OIDC trusted publishing is handled by npm itself.
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@cssert/cli@$version" version >/dev/null 2>&1; then
            echo "@cssert/cli@$version is already published"
            exit 0
          fi
          npm publish
          pnpm changeset tag
          git push --tags
